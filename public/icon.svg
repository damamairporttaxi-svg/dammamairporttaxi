<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="80" fill="#0c0c0c"/>

  <!-- Taxi car body -->
  <rect x="64" y="260" width="384" height="148" rx="20" fill="#f5c518"/>

  <!-- Taxi roof / cab -->
  <path d="M140 260 L160 180 C165 162 178 152 196 152 L316 152 C334 152 347 162 352 180 L372 260 Z" fill="#f5c518"/>

  <!-- Front windshield -->
  <path d="M310 172 L328 252 L258 252 L258 172 Z" rx="8" fill="#0c0c0c" opacity="0.75"/>

  <!-- Rear windshield -->
  <path d="M202 172 L184 252 L254 252 L254 172 Z" rx="8" fill="#0c0c0c" opacity="0.75"/>

  <!-- Door divider -->
  <rect x="252" y="172" width="8" height="80" fill="#0c0c0c" opacity="0.4"/>

  <!-- Front bumper -->
  <rect x="64" y="388" width="60" height="20" rx="8" fill="#d4a800"/>
  <!-- Rear bumper -->
  <rect x="388" y="388" width="60" height="20" rx="8" fill="#d4a800"/>

  <!-- Taxi stripe -->
  <rect x="64" y="290" width="384" height="14" fill="#0c0c0c" opacity="0.25"/>

  <!-- TAXI sign on roof -->
  <rect x="208" y="118" width="96" height="38" rx="8" fill="#f5c518" stroke="#0c0c0c" stroke-width="4"/>
  <text x="256" y="144" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#0c0c0c" letter-spacing="2">TAXI</text>

  <!-- Front wheel -->
  <circle cx="156" cy="408" r="56" fill="#1a1a1a"/>
  <circle cx="156" cy="408" r="36" fill="#2a2a2a"/>
  <circle cx="156" cy="408" r="18" fill="#f5c518"/>

  <!-- Rear wheel -->
  <circle cx="356" cy="408" r="56" fill="#1a1a1a"/>
  <circle cx="356" cy="408" r="36" fill="#2a2a2a"/>
  <circle cx="356" cy="408" r="18" fill="#f5c518"/>

  <!-- Headlight -->
  <rect x="68" y="300" width="36" height="20" rx="6" fill="#fffbe6" opacity="0.9"/>

  <!-- Tail light -->
  <rect x="408" y="300" width="36" height="20" rx="6" fill="#ff4444" opacity="0.8"/>
</svg>
