<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="90" fill="#0c0c0c"/>

  <!-- Car body -->
  <rect x="72" y="272" width="368" height="116" rx="20" fill="#f5c518"/>

  <!-- Cab roof (trapezoid) -->
  <path d="M148 272 L172 202 Q182 174 208 174 L304 174 Q330 174 340 202 L364 272 Z" fill="#f5c518"/>

  <!-- Left window -->
  <rect x="182" y="188" width="62" height="74" rx="10" fill="#0c0c0c" opacity="0.78"/>

  <!-- Right window -->
  <rect x="268" y="188" width="62" height="74" rx="10" fill="#0c0c0c" opacity="0.78"/>

  <!-- Center pillar -->
  <rect x="250" y="188" width="12" height="74" fill="#0c0c0c" opacity="0.4"/>

  <!-- Front wheel -->
  <circle cx="152" cy="388" r="50" fill="#1a1a1a"/>
  <circle cx="152" cy="388" r="30" fill="#f5c518"/>
  <circle cx="152" cy="388" r="12" fill="#0c0c0c"/>

  <!-- Rear wheel -->
  <circle cx="360" cy="388" r="50" fill="#1a1a1a"/>
  <circle cx="360" cy="388" r="30" fill="#f5c518"/>
  <circle cx="360" cy="388" r="12" fill="#0c0c0c"/>

  <!-- Headlight -->
  <rect x="76" y="304" width="34" height="18" rx="6" fill="#fffde0" opacity="0.95"/>

  <!-- Tail light -->
  <rect x="402" y="304" width="34" height="18" rx="6" fill="#ff5050" opacity="0.9"/>

  <!-- TAXI roof sign -->
  <rect x="210" y="136" width="92" height="42" rx="9" fill="#f5c518" stroke="#0c0c0c" stroke-width="5"/>
  <text x="256" y="167" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="24" font-weight="900" fill="#0c0c0c" letter-spacing="3">TAXI</text>

</svg>
